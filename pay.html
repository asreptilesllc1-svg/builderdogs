<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice — Builder Dogs</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="Invoice from Builder Dogs">
<meta property="og:description" content="View and pay your Builder Dogs invoice.">
<meta property="og:image" content="https://builderdogs.com/share.png">
<link rel="icon" href="favicon.png" type="image/png">
<script src="ddl-cards.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c; --border:#262626; --border2:#363636;
    --orange:#f97316; --gold:#f5c842; --white:#f0ece0; --muted:#6f6a62; --muted2:#a39d91; --green:#22c55e; --red:#f87171; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--white); font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  button { font-family:inherit; font-size:16px; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .wrap { max-width:560px; margin:0 auto; padding:22px 16px calc(40px + env(safe-area-inset-bottom)); }
  .brand { font-family:'Black Ops One',sans-serif; font-size:18px; color:var(--orange); text-decoration:none; }
  .brand span { color:var(--white); }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .badge { font-size:12px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; border-radius:20px; padding:3px 10px; border:1px solid; }
  .badge.open { color:var(--gold); border-color:rgba(245,200,66,0.45); }
  .badge.paid { color:var(--green); border-color:rgba(34,197,94,0.45); }
  .badge.void { color:var(--muted2); border-color:var(--border2); }
  h1 { font-family:'Black Ops One',sans-serif; font-weight:400; font-size:28px; line-height:1.1; }
  .sub { color:var(--muted2); margin-top:4px; }
  .total { font-family:'Oswald',sans-serif; font-size:46px; font-weight:600; line-height:1; margin:16px 0 4px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-top:16px; }
  h2 { font-size:14px; letter-spacing:1px; text-transform:uppercase; color:var(--muted2); font-weight:700; margin:24px 0 0; }
  .line { display:grid; grid-template-columns:40px 1fr auto; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  .line:last-of-type { border-bottom:0; }
  .line img, .thumb { width:40px; height:56px; object-fit:cover; border-radius:5px; background:var(--surface2); }
  .thumb { display:flex; align-items:center; justify-content:center; font-size:20px; }
  .t { font-weight:700; line-height:1.2; } .m { font-size:14px; color:var(--muted2); }
  .amt { font-family:'Oswald',sans-serif; }
  .tot-row { display:flex; justify-content:space-between; color:var(--muted2); padding:3px 0; }
  .tot-row.grand { color:var(--white); font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; border-top:1px solid var(--border); margin-top:6px; padding-top:8px; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; border-radius:12px; border:1px solid var(--border2); background:var(--surface2); color:var(--white); font-weight:700; font-size:18px; text-decoration:none; cursor:pointer; }
  .btn.shop { background:#5a31f4; border-color:#5a31f4; color:#fff; }
  .btn.small { min-height:40px; font-size:15px; border-radius:9px; width:auto; padding:0 14px; display:inline-flex; }
  .pay { margin-top:12px; }
  .pay h3 { font-size:19px; margin-bottom:6px; }
  .doge-amt { font-family:'Oswald',sans-serif; font-size:30px; font-weight:600; color:var(--gold); }
  .qr { background:#fff; border-radius:12px; padding:12px; width:220px; height:220px; margin:12px auto; }
  .qr svg { width:100%; height:100%; display:block; }
  .addr { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; word-break:break-all; background:var(--surface2); border-radius:10px; padding:10px 12px; margin-top:8px; }
  .copy-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .fine { font-size:14px; color:var(--muted2); margin-top:10px; }
  .state { text-align:center; padding:18px; border-radius:14px; margin-top:16px; font-size:19px; font-weight:700; }
  .state.paid { background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.35); color:var(--green); }
  .state.void { background:var(--surface); border:1px solid var(--border2); color:var(--muted2); }
  .note { white-space:pre-wrap; color:var(--muted2); }
  .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:28px; }
  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#1f1f1f; border:1px solid var(--border2); padding:10px 16px; border-radius:10px; display:none; z-index:10; }
  #toast.show { display:block; }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="sub">Loading invoice…</p></main>
<div id="toast" role="status"></div>
<script>
const SB_URL = 'https://hhscynnazxzwdicobpkl.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhoc2N5bm5henh6d2RpY29icGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MDI0NjYsImV4cCI6MjA5MTE3ODQ2Nn0.Pb_PvqfSsnvv8aWHli_L0Us1L7U250QzPzEF2NPgMxI';
const byId = Object.fromEntries((window.DDL_CARDS || []).map(c => [c.id, c]));
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const money = n => '$' + (Number(n) || 0).toFixed(2);
const fmtDate = d => new Date(d).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400); }
async function copy(t, ok){
  try { await navigator.clipboard.writeText(t); toast(ok); }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast(ok); } catch(_){} a.remove(); }
}
// Only send buyers to a real Shopify checkout
function safeShopUrl(u){
  try { const x = new URL(u); if(x.protocol === 'https:' && (/\.myshopify\.com$/.test(x.hostname) || /(^|\.)builderdogs\.com$/.test(x.hostname) || x.hostname === 'shop.app')) return x.href; } catch(e){}
  return null;
}

async function load(){
  const id = new URLSearchParams(location.search).get('i') || '';
  if(!/^[0-9a-f-]{36}$/i.test(id)) return fail('This invoice link is incomplete. Ask the seller to send it again.');
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/get_public_invoice`, {
      method:'POST', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_id:id }) });
    const inv = await r.json();
    if(!r.ok || !inv || !inv.id) return fail('We couldn\'t find this invoice. Ask the seller to send the link again.');
    render(inv);
  } catch(e){ fail('Couldn\'t load the invoice. Check your connection and refresh.'); }
}
function fail(m){ $('app').innerHTML = `<div class="top"><a class="brand" href="/">BUILDER<span>DOGS</span></a></div><h1>Invoice</h1><p class="sub" style="margin-top:10px">${esc(m)}</p>`; }

function render(inv){
  document.title = `Invoice #${inv.number} — Builder Dogs`;
  const seller = inv.seller_handle ? '@' + inv.seller_handle : 'Builder Dogs';
  const to = inv.buyer_handle ? '@' + inv.buyer_handle : (inv.buyer_name || '');
  const status = inv.status === 'void' ? 'Cancelled' : inv.status === 'paid' ? 'Paid' : 'Due';
  const shopUrl = inv.pay_shop && inv.shop_url ? safeShopUrl(inv.shop_url) : null;
  const xLink = inv.seller_handle ? `https://x.com/${encodeURIComponent(inv.seller_handle)}` : null;

  let pay = '';
  if(inv.status === 'open'){
    pay += `<h2>Pay</h2>`;
    if(shopUrl) pay += `<div class="card pay"><h3>Shop Pay or card</h3>
        <p class="m">Secure checkout through Shopify.</p>
        <a class="btn shop" style="margin-top:12px" href="${esc(shopUrl)}" rel="noopener">Pay ${money(inv.total)} with Shop Pay or card</a></div>`;
    if(inv.pay_doge && inv.doge_address) pay += `<div class="card pay" id="doge"><h3>DOGE</h3>
        <div class="doge-amt" id="doge-amt">Getting live DOGE price…</div>
        <div class="m" id="doge-rate"></div>
        <div class="qr" id="doge-qr" aria-label="QR code for the DOGE payment"></div>
        <div class="m">Send to this address</div>
        <div class="addr" id="doge-addr">${esc(inv.doge_address)}</div>
        <div class="copy-row">
          <button class="btn small" onclick="copy(document.getElementById('doge-addr').textContent,'Address copied.')">Copy address</button>
          <button class="btn small" id="copy-amt" onclick="copy(window.__dogeAmt||'','Amount copied.')" disabled>Copy amount</button>
        </div>
        <p class="fine">The DOGE amount follows the live price, so send it soon after opening this page. After you send it, message ${xLink ? `<a href="${xLink}" target="_blank" rel="noopener">${esc(seller)}</a>` : 'the seller'} on X with your transaction ID.</p></div>`;
    if(inv.pay_cash) pay += `<div class="card pay"><h3>Cash</h3>
        <p class="m">Pay in person or arrange it with ${xLink ? `<a href="${xLink}" target="_blank" rel="noopener">${esc(seller)}</a> on X` : 'the seller'}.</p></div>`;
    if(!shopUrl && !(inv.pay_doge && inv.doge_address) && !inv.pay_cash) pay += `<div class="card"><p class="m">Payment options are being set up. Check back shortly or message the seller.</p></div>`;
  }

  $('app').innerHTML = `
    <div class="top"><a class="brand" href="/">BUILDER<span>DOGS</span></a><span class="badge ${inv.status}">${status}</span></div>
    <h1>Invoice #${inv.number}</h1>
    <div class="sub">From ${esc(seller)}${to ? ' to ' + esc(to) : ''} · ${fmtDate(inv.created_at)}</div>
    <div class="total">${money(inv.total)}</div>
    ${inv.status === 'paid' ? `<div class="state paid">Paid${inv.paid_at ? ' on ' + fmtDate(inv.paid_at) : ''}. Thank you!</div>` : ''}
    ${inv.status === 'void' ? `<div class="state void">This invoice was cancelled. Nothing is due.</div>` : ''}
    ${pay}
    <h2>Items</h2>
    <div class="card">
      ${inv.lines.map(l => { const c = l.kind === 'card' ? byId[l.card_id] : null; return `<div class="line">
        ${c && c.image ? `<img src="${esc(c.image)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="thumb">📦</span>'}
        <div><div class="t">${esc(l.title)}</div><div class="m">${l.qty} × ${money(l.price)}</div></div>
        <span class="amt">${money(l.qty * l.price)}</span></div>`; }).join('')}
      <div style="margin-top:8px">
        <div class="tot-row"><span>Subtotal</span><span>${money(inv.subtotal)}</span></div>
        ${Number(inv.discount) ? `<div class="tot-row"><span>Discount</span><span>−${money(inv.discount)}</span></div>` : ''}
        ${Number(inv.shipping) ? `<div class="tot-row"><span>Shipping</span><span>${money(inv.shipping)}</span></div>` : ''}
        <div class="tot-row grand"><span>Total</span><span>${money(inv.total)}</span></div>
      </div>
    </div>
    ${inv.note ? `<h2>Note from the seller</h2><div class="card note">${esc(inv.note)}</div>` : ''}
    <p class="foot">Builder Dogs · Doginal Dogs community. Questions? ${xLink ? `<a href="${xLink}" target="_blank" rel="noopener">Message ${esc(seller)} on X</a>` : 'Contact the seller.'}</p>`;

  if(inv.status === 'open' && inv.pay_doge && inv.doge_address) dogeQuote(inv);
}

async function dogeQuote(inv){
  const amtEl = $('doge-amt'), rateEl = $('doge-rate');
  const drawQr = text => {
    if(typeof qrcode !== 'function') return;
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    $('doge-qr').innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true });
  };
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=usd');
    const js = await r.json();
    const usd = js && js.dogecoin && js.dogecoin.usd;
    if(!usd) throw new Error('no price');
    const doge = Math.ceil(Number(inv.total) / usd * 100) / 100;
    window.__dogeAmt = doge.toFixed(2);
    amtEl.textContent = `${doge.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 })} DOGE`;
    rateEl.textContent = `= ${money(inv.total)} at 1 DOGE = $${usd.toFixed(4)} · ${new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })}`;
    $('copy-amt').disabled = false;
    drawQr(`dogecoin:${inv.doge_address}?amount=${doge.toFixed(2)}`);
  } catch(e){
    amtEl.textContent = money(inv.total) + ' in DOGE';
    rateEl.textContent = 'Live price unavailable right now. Confirm the DOGE amount with the seller before sending.';
    drawQr(`dogecoin:${inv.doge_address}`);
  }
}
load();
</script>
</body>
</html>
